<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Student Performance Prediction</h1>

    <form method="POST">

        <label>Student ID</label>
        <input type="number" name="student_id" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label>Study Time (Hours)</label>
        <input type="number" step="0.1" name="study_time_hours" required>

        <label>Attendance (%)</label>
        <input type="number" step="0.1" name="attendance_percent" required>

        <label>Sleep Hours</label>
        <input type="number" step="0.1" name="sleep_hours" required>

        <label>Parental Education</label>
        <select name="parental_education" required>
            <option value="None">None</option>
            <option value="High School">High School</option>
            <option value="Bachelors">Bachelors</option>
            <option value="Masters">Masters</option>
            <option value="PhD">PhD</option>
        </select>

        <label>Internet Access</label>
        <select name="internet_access" required>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Extracurricular Activities</label>
        <select name="extracurricular_activities" required>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Part Time Job</label>
        <select name="part_time_job" required>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Previous Grade</label>
        <input type="number" step="0.1" name="previous_grade" required>

        <label>Final Grade</label>
        <select name="final_grade" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="F">F</option>
        </select>

        <button type="submit">Predict Score</button>

    </form>

    {% if prediction is not none %}
        <div class="result">
            Predicted Final Exam Score:
            <strong>{{ prediction }}</strong>
        </div>
    {% endif %}

</div>

</body>
</html>
